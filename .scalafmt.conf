version = "3.11.0"
runner.dialect = scala3

# === Базовые настройки ===
maxColumn = 120
indent.main = 2
indent.significant = 2

# === Пробелы (Spaces) ===
# nested-blocks.md: скобки без пробелов внутри
spaces.inParentheses = false
# control-structures.md: пробел после if/for/while перед '('
spaces.afterKeywordBeforeParen = true
# method-invocation.md: пробел только перед символическими операторами (a + (b)), но не перед текстовыми (obj.method(arg))
spaces.beforeApplyArgInParens = afterSymbolic

# === Документация (Scaladoc) ===
# scaladoc.md: выравнивание '*' по третьей колонке, сохранение авторского форматирования
docstrings.style = AsteriskSpace
docstrings.wrap = keep
docstrings.wrapMaxColumn = 80

# === Scala 3: Синтаксические переписывания ===
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.newSyntax.control = true
# true: переводит _ на * в импортах, => на as, _ в типах на ?. Это современный стандарт Scala 3.
rewrite.scala3.newSyntax.deprecated = true

# === End Markers (Scala 3) ===
rewrite.scala3.endMarker.spanHas = all
rewrite.scala3.endMarker.insert.minBlankGaps = 1
rewrite.scala3.endMarker.remove.maxBlankGaps = 0
rewrite.scala3.endMarker.preferInsert = true

# === Optional Braces / Fewer Braces ===
# Отключено по вашему требованию (предотвращает non-idempotent форматирование)
rewrite.scala3.optionalBraces.enabled = false
rewrite.scala3.optionalBraces.fewerBracesMinSpan = 2
rewrite.scala3.optionalBraces.fewerBracesMaxSpan = 0
rewrite.scala3.optionalBraces.preferInsert = true

# === Правила переписывания (Rewrite Rules) ===
rewrite.rules = [Imports, SortModifiers, PreferCurlyFors]

# declarations.md: автоматическая сортировка модификаторов в порядке гайда
rewrite.sortModifiers.preset = styleGuide

# Организация импортов
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [["java.*"], ["scala.*"], ["dotty.*"]]
rewrite.imports.contiguousGroups = only

# declarations.md: сохранение трейлинг-запятых при многострочных сигнатурах
rewrite.trailingCommas.style = keep

# === Скобки и переносы ===
# Современный стандарт Scala 3: закрывающая скобка на новой строке при переносе
danglingParentheses.callSite = true
danglingParentheses.defnSite = true

# preserve авторских переносов, автоматически добавляя новые только при превышении maxColumn
newlines.source = keep
# control-structures.md: implicit/using выносятся на новую строку перед списком параметров
newlines.implicitParamListModifierPrefer = before

# === Выравнивание ===
# Современная практика: отказ от вертикального выравнивания уменьшает шум в git-diff
align.preset = none
# Опционально: выравнивание стрелок в for-comprehensions для читаемости
align.tokens = [
  {
    code = "<-"
    owners = [{regex = "Enumerator.Generator"}]
  }
]

# === Проект ===
project.git = true
project.includePaths = ["glob:**.scala", "glob:**.sbt", "glob:**.sc"]
